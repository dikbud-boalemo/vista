<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VISTA DIKBUD BOALEMO</title>
</head>

<body>
<script>
(function () {

  const BASE_PATH = "/vista";

  const url = new URL(window.location.href);

  /*
   * Jika URL sudah merupakan hasil fallback sebelumnya,
   * JANGAN redirect lagi.
   */
  if (url.searchParams.has("p")) {
    return;
  }

  let path = url.pathname;

  /*
   * Hapus /vista dari path.
   */
  if (path.indexOf(BASE_PATH) === 0) {
    path = path.substring(BASE_PATH.length);
  }

  if (!path || path === "") {
    path = "/";
  }

  if (!path.startsWith("/")) {
    path = "/" + path;
  }

  /*
   * Parameter query selain p tetap dipertahankan.
   *
   * Contoh:
   * /vista/tamu?qr=QR-LOBBY-01
   *
   * menjadi:
   * /vista/?p=%2Ftamu&qr=QR-LOBBY-01
   */
  const params = new URLSearchParams();

  params.set("p", path);

  url.searchParams.forEach(function (value, key) {
    if (key !== "p") {
      params.append(key, value);
    }
  });

  const target =
    BASE_PATH +
    "/?" +
    params.toString() +
    url.hash;

  window.location.replace(target);

})();
</script>
</body>
</html>
