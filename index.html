<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VISTA DIKBUD BOALEMO - Visitor Integrated Service & Administration</title>

  <link
    rel="icon"
    type="image/jpeg"
    href="https://i.ibb.co.com/vvJgRV7S/Lambang-Kabupaten-Boalemo.jpg"
  >

  <meta
    name="description"
    content="Visitor Integrated Service & Administration - Dinas Pendidikan dan Kebudayaan Kabupaten Boalemo. Datang. Terlayani. Tercatat."
  >

  <meta property="og:title" content="VISTA DIKBUD BOALEMO">
  <meta
    property="og:description"
    content="Visitor Integrated Service & Administration - Dinas Pendidikan dan Kebudayaan Kabupaten Boalemo."
  >
  <meta property="og:type" content="website">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #vista-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #020617;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at top,
          rgba(16, 185, 129, 0.16),
          transparent 45%
        ),
        #020617;
      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
    }

    #loading.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-box {
      text-align: center;
      color: #fff;
      padding: 32px;
    }

    .loading-logo {
      width: 74px;
      height: 74px;
      object-fit: contain;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .loading-subtitle {
      margin-top: 7px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 13px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="loading-box">

      <img
        class="loading-logo"
        src="https://i.ibb.co.com/vvJgRV7S/Lambang-Kabupaten-Boalemo.jpg"
        alt="Lambang Kabupaten Boalemo"
      >

      <div class="spinner"></div>

      <div class="loading-title">
        VISTA DIKBUD BOALEMO
      </div>

      <div class="loading-subtitle">
        Visitor Integrated Service & Administration
      </div>

    </div>
  </div>

  <iframe
    id="vista-frame"
    title="VISTA DIKBUD BOALEMO"
    allow="
      camera;
      microphone;
      geolocation;
      clipboard-write;
      storage-access
    "
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <script>
    (() => {

      /* =========================================================
         CONFIG
      ========================================================= */

      const BASE_PATH = "/vista";

      const VISTA_EXEC_URL =
        "https://script.google.com/macros/s/AKfycby-7soEAaGZGgU_-pr4RMp9GTN0JgIUUF4KRYl_-0FySihJa1m4R4lIKRtlKpcIOq3cNQ/exec";

      const ALLOWED_EMBED_ORIGINS = [
        "https://script.google.com",
        "https://script.googleusercontent.com"
      ];

      const iframe =
        document.getElementById("vista-frame");

      const loading =
        document.getElementById("loading");


      /* =========================================================
         ROUTE TITLES
      ========================================================= */

      const ROUTE_TITLES = {
        "/": "VISTA DIKBUD BOALEMO",
        "/dashboard": "Dashboard | VISTA DIKBUD BOALEMO",
        "/live-visit": "Live Visit | VISTA DIKBUD BOALEMO",
        "/tamu": "Data Tamu | VISTA DIKBUD BOALEMO",
        "/administrasi": "Administrasi Tamu | VISTA DIKBUD BOALEMO",
        "/pegawai": "Master Pegawai | VISTA DIKBUD BOALEMO",
        "/bidang": "Master Bidang | VISTA DIKBUD BOALEMO",
        "/qr-access": "QR Access | VISTA DIKBUD BOALEMO",
        "/analytics": "Analytics | VISTA DIKBUD BOALEMO",
        "/audit-log": "Audit Log | VISTA DIKBUD BOALEMO",
        "/settings": "Settings | VISTA DIKBUD BOALEMO"
      };


      /* =========================================================
         ROUTE NORMALIZER
      ========================================================= */

      function normalizeRoute(route) {

        if (!route) {
          return "/";
        }

        route = String(route)
          .trim()
          .split("?")[0];

        if (!route.startsWith("/")) {
          route = "/" + route;
        }

        if (
          route.length > 1 &&
          route.endsWith("/")
        ) {
          route = route.slice(0, -1);
        }

        if (
          !Object.prototype.hasOwnProperty.call(
            ROUTE_TITLES,
            route
          )
        ) {
          return "/";
        }

        return route;
      }


      /* =========================================================
         CURRENT ROUTE
      ========================================================= */

      function getCurrentRoute() {

        let path =
          window.location.pathname;

        if (
          path.indexOf(BASE_PATH) === 0
        ) {
          path =
            path.substring(BASE_PATH.length);
        }

        if (!path) {
          path = "/";
        }

        if (!path.startsWith("/")) {
          path = "/" + path;
        }

        return normalizeRoute(path);
      }


      /* =========================================================
         CURRENT QUERY
      ========================================================= */

      function getCurrentSearch() {
        return window.location.search || "";
      }


      /* =========================================================
         BUILD CLEAN URL
      ========================================================= */

      function buildUrl(route, search = "") {

        route =
          normalizeRoute(route);

        let url =
          BASE_PATH;

        if (route === "/") {
          url += "/";
        } else {
          url += route;
        }

        if (search) {
          url += search;
        }

        return url;
      }


      /* =========================================================
         TITLE
      ========================================================= */

      function updateTitle(route) {

        route =
          normalizeRoute(route);

        document.title =
          ROUTE_TITLES[route] ||
          ROUTE_TITLES["/"];
      }


      /* =========================================================
         SEND MESSAGE TO APPS SCRIPT
      ========================================================= */

      function sendRouteToIframe(route) {

        if (
          !iframe ||
          !iframe.contentWindow
        ) {
          return;
        }

        iframe.contentWindow.postMessage(
          {
            type: "VISTA_SET_ROUTE",
            route: normalizeRoute(route),
            search: getCurrentSearch()
          },
          "*"
        );
      }


      /* =========================================================
         INITIAL ROUTE
      ========================================================= */

      function resolveInitialRoute() {

        const url =
          new URL(window.location.href);

        const params =
          new URLSearchParams(url.search);

        const p =
          params.get("p");

        if (p !== null) {

          let route =
            decodeURIComponent(p);

          params.delete("p");

          if (!route.startsWith("/")) {
            route = "/" + route;
          }

          route =
            normalizeRoute(route);

          const query =
            params.toString();

          const cleanUrl =
            buildUrl(
              route,
              query ? "?" + query : ""
            );

          window.history.replaceState(
            {
              route: route
            },
            "",
            cleanUrl
          );

          return route;
        }

        return getCurrentRoute();
      }


      const initialRoute =
        resolveInitialRoute();

      updateTitle(initialRoute);


      /* =========================================================
         APPS SCRIPT SRC
         HANYA QUERY PARAMETER DIKIRIM KE /exec
      ========================================================= */

      const search =
        getCurrentSearch();

      iframe.src =
        search
          ? VISTA_EXEC_URL + search
          : VISTA_EXEC_URL;


      /* =========================================================
         RECEIVE MESSAGE
      ========================================================= */

      window.addEventListener(
        "message",
        function (event) {

          /*
           * Pastikan pesan benar-benar berasal
           * dari iframe VISTA milik kita.
           */
          if (
            event.source !==
            iframe.contentWindow
          ) {
            return;
          }

          /*
           * Apps Script dapat menggunakan
           * script.google.com atau
           * script.googleusercontent.com.
           */
          if (
            !ALLOWED_EMBED_ORIGINS.includes(
              event.origin
            )
          ) {
            return;
          }

          const data =
            event.data;

          if (
            !data ||
            typeof data !== "object"
          ) {
            return;
          }


          /* -----------------------------------------------------
             VISTA READY
          ----------------------------------------------------- */

          if (
            data.type ===
            "VISTA_READY"
          ) {

            sendRouteToIframe(
              getCurrentRoute()
            );

            return;
          }


          /* -----------------------------------------------------
             VISTA NAVIGATE
          ----------------------------------------------------- */

          if (
            data.type ===
            "VISTA_NAVIGATE"
          ) {

            const route =
              normalizeRoute(
                data.route
              );

            const currentRoute =
              getCurrentRoute();

            if (
              currentRoute !==
              route
            ) {

              const targetUrl =
                buildUrl(
                  route,
                  getCurrentSearch()
                );

              window.history.pushState(
                {
                  route: route
                },
                "",
                targetUrl
              );
            }

            updateTitle(route);

            return;
          }

        },
        false
      );


      /* =========================================================
         BACK / FORWARD
      ========================================================= */

      window.addEventListener(
        "popstate",
        function () {

          const route =
            getCurrentRoute();

          updateTitle(route);

          sendRouteToIframe(route);

        },
        false
      );


      /* =========================================================
         IFRAME LOAD
      ========================================================= */

      iframe.addEventListener(
        "load",
        function () {

          sendRouteToIframe(
            getCurrentRoute()
          );

          setTimeout(
            function () {
              loading.classList.add("hide");
            },
            200
          );

        },
        false
      );


      /* =========================================================
         FALLBACK LOADING
      ========================================================= */

      setTimeout(
        function () {
          loading.classList.add("hide");
        },
        10000
      );

    })();
  </script>

</body>
</html>
