<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VISTA DIKBUD BOALEMO - Visitor Integrated Service & Administration</title>

  <link
    rel="icon"
    type="image/jpeg"
    href="https://i.ibb.co.com/vvJgRV7S/Lambang-Kabupaten-Boalemo.jpg"
  >

  <meta
    name="description"
    content="Visitor Integrated Service & Administration - Dinas Pendidikan dan Kebudayaan Kabupaten Boalemo. Datang. Terlayani. Tercatat."
  >

  <meta property="og:title" content="VISTA DIKBUD BOALEMO">
  <meta
    property="og:description"
    content="Visitor Integrated Service & Administration - Dinas Pendidikan dan Kebudayaan Kabupaten Boalemo."
  >
  <meta property="og:type" content="website">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
    }

    body {
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #vista-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #020617;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at top,
          rgba(16, 185, 129, 0.16),
          transparent 45%
        ),
        #020617;
      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
    }

    #loading.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-box {
      text-align: center;
      color: white;
      padding: 32px;
    }

    .loading-logo {
      width: 74px;
      height: 74px;
      object-fit: contain;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 20px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .loading-subtitle {
      margin-top: 7px;
      color: rgba(255, 255, 255, 0.65);
      font-size: 13px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="loading-box">
      <img
        class="loading-logo"
        src="https://i.ibb.co.com/vvJgRV7S/Lambang-Kabupaten-Boalemo.jpg"
        alt="Lambang Kabupaten Boalemo"
      >

      <div class="spinner"></div>

      <div class="loading-title">
        VISTA DIKBUD BOALEMO
      </div>

      <div class="loading-subtitle">
        Visitor Integrated Service & Administration
      </div>
    </div>
  </div>

  <!--
    GOOGLE APPS SCRIPT WEB APP
    Tetap gunakan URL Web App VISTA yang sebenarnya.
  -->
  <iframe
    id="vista-frame"
    title="VISTA DIKBUD BOALEMO"
    allow="camera; microphone; geolocation; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <script>
    (function () {

      /* =========================================================
         CONFIG
      ========================================================= */

      const BASE_PATH = "/vista";

      const VISTA_EXEC_URL =
        "https://script.google.com/macros/s/AKfycby-7soEAaGZGgU_-pr4RMp9GTN0JgIUUF4KRYl_-0FySihJa1m4R4lIKRtlKpcIOq3cNQ/exec";

      const GITHUB_ORIGIN =
        "https://dikbud-boalemo.github.io";

      /*
       * Origin yang diharapkan dari iframe Apps Script.
       * Untuk web app Apps Script umumnya berasal dari script.google.com.
       */
      const APPS_SCRIPT_ORIGIN =
        "https://script.google.com";


      /* =========================================================
         ELEMENT
      ========================================================= */

      const iframe = document.getElementById("vista-frame");
      const loading = document.getElementById("loading");


      /* =========================================================
         ROUTE TITLE
      ========================================================= */

      const ROUTE_TITLES = {
        "/": "VISTA DIKBUD BOALEMO",
        "/dashboard": "Dashboard | VISTA DIKBUD BOALEMO",
        "/live-visit": "Live Visit | VISTA DIKBUD BOALEMO",
        "/tamu": "Data Tamu | VISTA DIKBUD BOALEMO",
        "/administrasi": "Administrasi Tamu | VISTA DIKBUD BOALEMO",
        "/pegawai": "Master Pegawai | VISTA DIKBUD BOALEMO",
        "/bidang": "Master Bidang | VISTA DIKBUD BOALEMO",
        "/qr-access": "QR Access | VISTA DIKBUD BOALEMO",
        "/analytics": "Analytics | VISTA DIKBUD BOALEMO",
        "/audit-log": "Audit Log | VISTA DIKBUD BOALEMO",
        "/settings": "Settings | VISTA DIKBUD BOALEMO"
      };


      /* =========================================================
         NORMALIZE ROUTE
      ========================================================= */

      function normalizeRoute(route) {

        if (!route) {
          return "/";
        }

        route = String(route).trim();

        /*
         * Kalau route datang dengan query string,
         * pisahkan hanya bagian pathname.
         */
        route = route.split("?")[0];

        if (!route.startsWith("/")) {
          route = "/" + route;
        }

        /*
         * Hilangkan trailing slash kecuali root.
         */
        if (route.length > 1 && route.endsWith("/")) {
          route = route.slice(0, -1);
        }

        /*
         * Hanya izinkan route yang dikenal.
         */
        const allowedRoutes = Object.keys(ROUTE_TITLES);

        if (!allowedRoutes.includes(route)) {
          return "/";
        }

        return route;
      }


      /* =========================================================
         URL STATE
      ========================================================= */

      function getInitialState() {

        const currentUrl =
          new URL(window.location.href);

        let path =
          currentUrl.pathname;

        let searchParams =
          new URLSearchParams(currentUrl.search);

        /*
         * Jika datang melalui 404.html,
         * route sementara disimpan di parameter ?p=
         */
        const spaRoute =
          searchParams.get("p");

        if (spaRoute !== null) {

          let routeFrom404 =
            decodeURIComponent(spaRoute);

          /*
           * Hapus parameter p.
           */
          searchParams.delete("p");

          /*
           * Normalisasi route.
           */
          path = routeFrom404;
        }

        /*
         * Hilangkan BASE_PATH dari pathname.
         */
        if (path.startsWith(BASE_PATH)) {
          path = path.substring(BASE_PATH.length);
        }

        if (!path || path === "") {
          path = "/";
        }

        if (!path.startsWith("/")) {
          path = "/" + path;
        }

        path =
          normalizeRoute(path);

        return {
          route: path,
          search: searchParams
        };
      }


      /* =========================================================
         GET CURRENT CLEAN ROUTE
      ========================================================= */

      function getCurrentRoute() {

        let path =
          window.location.pathname;

        if (path.startsWith(BASE_PATH)) {
          path =
            path.substring(BASE_PATH.length);
        }

        if (!path || path === "") {
          path = "/";
        }

        if (!path.startsWith("/")) {
          path = "/" + path;
        }

        return normalizeRoute(path);
      }


      /* =========================================================
         GET CURRENT QUERY STRING
      ========================================================= */

      function getCurrentSearch() {
        return window.location.search || "";
      }


      /* =========================================================
         BUILD URL
      ========================================================= */

      function buildRouteUrl(route, search) {

        route =
          normalizeRoute(route);

        let url =
          BASE_PATH;

        if (route !== "/") {
          url += route;
        } else {
          url += "/";
        }

        if (search) {
          if (typeof search === "string") {
            url += search;
          } else {
            const query =
              search.toString();

            if (query) {
              url += "?" + query;
            }
          }
        }

        return url;
      }


      /* =========================================================
         SET DOCUMENT TITLE
      ========================================================= */

      function updateDocumentTitle(route) {

        route =
          normalizeRoute(route);

        document.title =
          ROUTE_TITLES[route] ||
          "VISTA DIKBUD BOALEMO";
      }


      /* =========================================================
         SEND ROUTE TO APPS SCRIPT IFRAME
      ========================================================= */

      function sendRouteToIframe(route) {

        if (
          !iframe ||
          !iframe.contentWindow
        ) {
          return;
        }

        route =
          normalizeRoute(route);

        iframe.contentWindow.postMessage(
          {
            type: "VISTA_SET_ROUTE",
            route: route,
            search: getCurrentSearch()
          },
          APPS_SCRIPT_ORIGIN
        );
      }


      /* =========================================================
         OPEN INITIAL URL
      ========================================================= */

      const initialState =
        getInitialState();

      /*
       * Kalau datang dari 404.html dan ada ?p=...
       * bersihkan URL menjadi clean URL.
       *
       * Contoh:
       * /vista/?p=%2Fpegawai
       *
       * menjadi:
       * /vista/pegawai
       */
      const initialCleanUrl =
        buildRouteUrl(
          initialState.route,
          initialState.search
        );

      if (
        window.location.pathname +
        window.location.search !==
        initialCleanUrl
      ) {

        window.history.replaceState(
          {
            route: initialState.route
          },
          "",
          initialCleanUrl
        );
      }

      updateDocumentTitle(
        initialState.route
      );


      /* =========================================================
         SET IFRAME SRC
      ========================================================= */

      /*
       * HANYA query parameter yang diteruskan ke Apps Script.
       *
       * Contoh:
       * /vista/?qr=QR-LOBBY-01
       *
       * menjadi:
       * Apps Script /exec?qr=QR-LOBBY-01
       *
       * Route /pegawai tidak dikirim sebagai query.
       * Route dikirim menggunakan postMessage.
       */
      const appsScriptUrl =
        VISTA_EXEC_URL +
        initialState.search.toString()
          ? "?" + initialState.search.toString()
          : "";

      iframe.src =
        initialState.search.toString()
          ? VISTA_EXEC_URL +
            "?" +
            initialState.search.toString()
          : VISTA_EXEC_URL;


      /* =========================================================
         RECEIVE MESSAGE FROM APPS SCRIPT
      ========================================================= */

      window.addEventListener(
        "message",
        function (event) {

          /*
           * Security:
           * hanya terima pesan dari Apps Script.
           */
          if (
            event.origin !==
            APPS_SCRIPT_ORIGIN
          ) {
            return;
          }

          const data =
            event.data;

          if (
            !data ||
            typeof data !== "object"
          ) {
            return;
          }


          /* -----------------------------------------------------
             VISTA NAVIGATE
          ----------------------------------------------------- */

          if (
            data.type ===
            "VISTA_NAVIGATE"
          ) {

            const route =
              normalizeRoute(
                data.route
              );

            const currentRoute =
              getCurrentRoute();

            if (
              currentRoute !==
              route
            ) {

              const targetUrl =
                buildRouteUrl(
                  route,
                  getCurrentSearch()
                );

              window.history.pushState(
                {
                  route: route
                },
                "",
                targetUrl
              );
            }

            updateDocumentTitle(
              route
            );

            return;
          }


          /* -----------------------------------------------------
             VISTA READY
          ----------------------------------------------------- */

          if (
            data.type ===
            "VISTA_READY"
          ) {

            sendRouteToIframe(
              getCurrentRoute()
            );

            return;
          }

        },
        false
      );


      /* =========================================================
         BROWSER BACK / FORWARD
      ========================================================= */

      window.addEventListener(
        "popstate",
        function () {

          const route =
            getCurrentRoute();

          updateDocumentTitle(
            route
          );

          sendRouteToIframe(
            route
          );

        },
        false
      );


      /* =========================================================
         IFRAME LOAD
      ========================================================= */

      iframe.addEventListener(
        "load",
        function () {

          /*
           * Kirim route setelah Apps Script
           * selesai dimuat.
           */
          sendRouteToIframe(
            getCurrentRoute()
          );

          /*
           * Hilangkan loading overlay.
           */
          setTimeout(
            function () {
              loading.classList.add(
                "hide"
              );
            },
            150
          );

        },
        false
      );


      /* =========================================================
         SAFETY FALLBACK
      ========================================================= */

      setTimeout(
        function () {
          loading.classList.add(
            "hide"
          );
        },
        8000
      );

    })();
  </script>

</body>
</html>
